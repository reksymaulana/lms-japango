{% extends "base.html" %}
{% block title %}{{ t.nav_review }} · Japango{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl">
  <div class="mb-6 text-center">
    <span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-emerald-100 text-2xl font-bold text-emerald-700">復</span>
    <p class="mt-4 text-sm font-semibold text-emerald-700">{{ t.review_kicker }}</p>
    <h1 class="mt-1 text-3xl font-bold tracking-tight">{{ t.review_heading }}</h1>
    <p class="mt-2 text-slate-600">{{ t.review_description }}</p>
  </div>
  <div id="flashcard" aria-live="polite">{% include "partials/flashcard.html" %}</div>
</section>
{% endblock %}
